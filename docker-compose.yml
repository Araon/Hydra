services:
  postgres:
    build:
      context: .
      dockerfile: postgres-dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  scheduler:
    build:
      context: .
      dockerfile: ./src/scheduler/scheduler.dockerfile
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      COORDINATOR_URL: http://coordinator:5001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 5000), 2); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 12

  coordinator:
    build:
      context: .
      dockerfile: ./src/coordinator/coordinator.dockerfile
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 5001), 2); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: 
      context: ./src/worker
      dockerfile: worker.dockerfile
    environment:
      COORDINATOR_URL: "http://coordinator:5001"
      WORKER_MAX_CONCURRENCY: "1"
      HYDRA_WORKSPACE: /work
    depends_on:
      coordinator:
        condition: service_healthy
    restart: on-failure

  tests:
    build:
      context: .
      dockerfile: ./src/scheduler/scheduler.dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=postgres
      - PYTHONPATH=/app
      - 'SQLALCHEMY_DATABASE_URI=sqlite:///:memory:'
      - 'SKIP_NETWORK_CALLS=1'
      - 'SKIP_BACKGROUND_TASKS=1'
      - 'BASE_URL=http://scheduler:5000'
    command: pytest -q
    volumes:
      - ./:/app
    working_dir: /app
